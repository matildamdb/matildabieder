<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Matilda Bieder's all-time favourite playlist.">
  <title>Playlist – Matilda Bieder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html">Matilda Bieder</a>
      <nav aria-label="Main navigation">
        <a href="studies.html">Studies</a>
        <a href="favourites.html">Favourites</a>
        <a href="zine.html">Zine</a>
        <a href="playlist.html" aria-current="page">Playlist</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page">Playlist</h1>
    <section>
      <div class="section-head">
        <h2>All-time favourites</h2>
        <div class="section-body">
          <div id="player"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© <span id="year">2026</span> Matilda Bieder</span>
    </div>
  </footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script>
    var PLAYLIST = "https://music.youtube.com/playlist?list=PLPziQc90oPCw&si=9hhGjH9R1OGgm28O";

  var box = document.getElementById("player");
  var match = PLAYLIST.match(/[?&]list=([^&]+)/);

  if (match) {
    var id = match[1];
    box.innerHTML =
      '<iframe title="Playlist" height="400" loading="lazy" ' +
      'src="https://www.youtube.com/embed/videoseries?list=' + id + '" ' +
      'allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
      '<p><a href="https://music.youtube.com/playlist?list=' + id + '">Open in YouTube Music ↗</a></p>';
  } else {
    box.innerHTML = '<p>No playlist yet. Open <code>playlist.html</code>, find <code>var PLAYLIST</code> and paste your YouTube Music link between the quotes.</p>';
  }
</script>
</body>
</html>
